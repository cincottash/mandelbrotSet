# Builds mandelbrotSet for Windows (a single mandelbrotSet.exe) and Linux (mandelbrotSet-x86_64.AppImage).
#
# - Pull requests and manual runs: build both, check that each starts, and keep them as downloadable artifacts of
#   the run for 14 days (nothing is published).
# - Every merge into the default branch: the same, then publish a GitHub Release with both files attached, tagged
#   with the next version (v1.1.1 -> v1.1.2). Put [minor] or [major] in the PR title for v1.2.0 or v2.0.0 instead.
# - A version tag pushed by hand (git tag v1.5.0; git push origin v1.5.0) also publishes a release.
#
# The build machines have no graphics card: the start checks prove the program and its window load; the fractal
# itself is drawn there only where a software OpenGL 4.3 exists (Linux's Mesa).

name: Build apps

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write          # needed to create the release
  pull-requests: read      # needed to read the merged pull request's title (for [minor] / [major])

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # all tags, to find the latest version
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            message=$(git log -1 --format=%s "$GITHUB_SHA")
            pr_title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].title // ""' 2>/dev/null || true)
            echo "Commit title: $message"
            echo "Pull request title: ${pr_title:-(none found)}"
            if grep -qi '\[major\]' <<< "$message $pr_title"; then
              version="$((major + 1)).0.0"
            elif grep -qi '\[minor\]' <<< "$message $pr_title"; then
              version="${major}.$((minor + 1)).0"
            else
              version="${major}.${minor}.$((patch + 1))"
            fi
            if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
              version="${version}-test.${GITHUB_RUN_NUMBER}"
            fi
            echo "Latest release tag: $latest"
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows .exe
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-mpfr mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-libtiff mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-harfbuzz mingw-w64-ucrt-x86_64-freetype mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-pcre2 mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libb2 mingw-w64-ucrt-x86_64-brotli mingw-w64-ucrt-x86_64-bzip2

      - name: Build the .exe (one self-contained file)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON \
            -DCMAKE_PREFIX_PATH=/ucrt64/qt6-static -DRELEASE_VERSION=${{ needs.version.outputs.version }}
          cmake --build build
          mkdir -p dist
          cp build/mandelbrotSet.exe dist/
          ls -l dist
          # Fail if the exe needs any DLL that isn't part of Windows.
          if objdump -p dist/mandelbrotSet.exe | grep "DLL Name" | grep -iE "lib(stdc|gcc|winpthread|png|z|freetype|harfbuzz|crypto|mpfr|gmp|webp)|Qt6"; then
            echo "The exe depends on DLLs that aren't part of Windows"; exit 1
          fi

      - name: Check the .exe starts
        shell: pwsh
        run: |
          $data = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\appdata"
          # Draws the window off-screen to a picture and exits: proves Qt, its plugins and the UI all load.
          $p = Start-Process dist/mandelbrotSet.exe -ArgumentList "--screenshot", "$env:RUNNER_TEMP\shot.png" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\shot.png")) { throw "The screenshot check failed (exit $($p.ExitCode))" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/mandelbrotSet.exe -ArgumentList "--data-folder", "$data" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "mandelbrotSet.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          "mandelbrotSet.exe started and kept running"

      - uses: actions/upload-artifact@v4
        with:
          name: mandelbrotSet-windows
          path: dist/mandelbrotSet.exe
          retention-days: 14

  linux:
    name: Linux AppImage
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 \
            libxcb-image0 libfontconfig1 libdbus-1-3 libfuse2 libmpfr-dev libgmp-dev libwebp-dev xvfb \
            mesa-utils libgl1-mesa-dri

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRELEASE_VERSION=${{ needs.version.outputs.version }}
          cmake --build build

      - name: Package the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          EXTRA_QT_MODULES: svg
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          cp resources/icon.svg mandelbrotSet.svg
          ./linuxdeploy --appdir AppDir --executable build/mandelbrotSet \
            --desktop-file packaging/linux/mandelbrotSet.desktop --icon-file mandelbrotSet.svg \
            --plugin qt --output appimage
          mkdir -p dist
          mv Mandelbrot*.AppImage dist/mandelbrotSet-x86_64.AppImage 2>/dev/null || mv *.AppImage dist/mandelbrotSet-x86_64.AppImage
          ls -l dist

      - name: Check the AppImage starts (on a virtual X11 display with software OpenGL)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          xvfb-run -a ./dist/mandelbrotSet-x86_64.AppImage --screenshot "$RUNNER_TEMP/shot.png"
          test -s "$RUNNER_TEMP/shot.png"
          xvfb-run -a env QT_QPA_PLATFORM=wayland XDG_SESSION_TYPE=wayland WAYLAND_DISPLAY=wayland-0 \
            ./dist/mandelbrotSet-x86_64.AppImage --screenshot "$RUNNER_TEMP/wayland.png"
          test -s "$RUNNER_TEMP/wayland.png"
          echo "Started through X11, also with QT_QPA_PLATFORM=wayland"

      - uses: actions/upload-artifact@v4
        with:
          name: mandelbrotSet-linux
          path: dist/mandelbrotSet-x86_64.AppImage
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mandelbrot Set $VERSION" --generate-notes \
            dist/mandelbrotSet.exe dist/mandelbrotSet-x86_64.AppImage
